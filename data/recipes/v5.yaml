version: v5
output_dir: data/processed
seed: 42

# v5: task nâng cấp REWRITE -> REWRITE_AND_CLASSIFY. Output giờ là
# {"rewrite_message", "domain": online|offline}. Bổ sung nguồn ONLINE mới
# (data/raw/dialogues_online.jsonl) vì toàn bộ nguồn cũ đều là offline.
# Stratify thêm meta.online_offline để online xuất hiện đều ở train/valid/test.

split:
  train_ratio: 0.8
  valid_ratio: 0.1
  seed: 42
  stratify_by:
    - meta.domain
    - meta.online_offline
    - meta.context_required

sources:
  - name: base_mimo
    path: data/train/dialogues_train_api.jsonl
    placement: split
    take: all

  # ONLINE data (chit-chat, hỏi đáp chung, cách dùng/khắc phục lỗi xe).
  # Sinh bằng: python -m src.data.generate_online --target 0
  #            --output data/raw/dialogues_online.jsonl
  # Để tăng tỉ lệ online: mở rộng pool trong generate_online.py / nâng MAX_PER_GOLD,
  # hoặc giảm `take` của base_mimo. Hiện ~1.5k online; có thể scale thêm bằng teacher.
  - name: online_synth
    path: data/raw/dialogues_online.jsonl
    placement: split
    take: all

  - name: patch_b2b3
    path: data/patches/patch_b2b3.jsonl
    placement: train_only
    take: 790

  - name: patch_b4
    path: data/patches/patch_b4.jsonl
    placement: train_only
    take: 1700

  # short-contextual everyday utterances: when NOT to rewrite into a tool command.
  # train_only; held-out eval lives in data/bench/bench_short_contextual.jsonl and is
  # deliberately NOT referenced by guards.bench_leak_check below.
  - name: patch_short_contextual
    path: data/patches/patch_short_contextual.jsonl
    placement: train_only
    take: all

guards:
  dedupe_by: conversations
  bench_leak_check: data/bench/dialogues_bench_browser.jsonl
  bench_leak_policy: drop
